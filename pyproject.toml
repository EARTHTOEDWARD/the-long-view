[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-long-view"
version = "0.1.0"
description = "A game and evaluation for judgment across connected decisions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "The Long View contributors"}]
dependencies = []

[project.scripts]
long-view = "the_long_view.engine:main"

[tool.setuptools.packages.find]
where = ["src"]
