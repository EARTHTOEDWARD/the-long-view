name: Kernel checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  semantic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the frozen game semantics
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check the no-install command
        run: python run.py --help
